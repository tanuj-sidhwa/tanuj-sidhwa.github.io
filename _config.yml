title: "Tanuj Sidhwa | Research Portfolio"
masthead_title: "Tanuj Sidhwa"
email: sidhwatanuj@gmail.com
description: >-
  Tanuj Sidhwa is a Mechanical Engineering undergraduate researcher at IIT Indore
  working on computational fluid dynamics, propulsion, combustion, and multiphysics modelling.
url: "https://tanuj-sidhwa.github.io"
baseurl: ""
locale: "en-US"
timezone: Asia/Kolkata
minimal_mistakes_skin: "dark"
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
search: false
atom_feed:
  hide: true
markdown: kramdown
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
include:
  - _pages
  - _posts
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jemoji
  - jekyll-include-cache
author:
  name: "Tanuj Sidhwa"
  avatar: "/assets/images/dp.jpg"
  bio: "Mechanical Engineering · IIT Indore · CFD, propulsion, and combustion research"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:sidhwatanuj@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/tanuj-sidhwa/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/tanuj-sidhwa"
footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:sidhwatanuj@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/tanuj-sidhwa"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/tanuj-sidhwa/"
    - label: "Technical blog"
      icon: "fas fa-fw fa-pen"
      url: "/blog/"
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
      share: false
      comments: false
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
