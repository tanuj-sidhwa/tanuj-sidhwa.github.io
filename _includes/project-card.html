{% assign project = include.item %}
<a class="project-card" href="{{ project.url | relative_url }}">
  <img class="project-card__image" src="{{ project.image | relative_url }}" alt="{{ project.alt | escape }}" loading="lazy">
  <div class="project-card__body">
    <span class="eyebrow">{{ project.category }}</span>
    <h3>{{ project.title }}</h3>
    <p class="research-card__org">{{ project.organization }}</p>
    <p>{{ project.summary }}</p>
    <span class="card-link">View project <span aria-hidden="true">→</span></span>
  </div>
</a>
