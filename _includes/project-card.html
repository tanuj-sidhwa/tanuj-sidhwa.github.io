{% assign project = include.item %}
<article class="engineering-entry">
  {% if project.image %}
    <a href="{{ project.url | relative_url }}" class="engineering-entry__figure">
      <img src="{{ project.image | relative_url }}" alt="{{ project.alt | escape }}" loading="lazy">
    </a>
  {% endif %}
  <div class="engineering-entry__body">
    <p class="entry-affiliation">{{ project.organization }}</p>
    <h3><a href="{{ project.url | relative_url }}">{{ project.title }}</a></h3>
    <p>{{ project.summary }}</p>
    <a class="text-link" href="{{ project.url | relative_url }}">Read project details <span aria-hidden="true">→</span></a>
  </div>
</article>
