{% assign research = include.item %}
<a class="research-card" href="{{ research.url | relative_url }}">
  {% if research.image %}
    <div class="research-card__visual research-card__visual--image">
      <img src="{{ research.image | relative_url }}" alt="{{ research.alt | escape }}" loading="lazy">
    </div>
  {% else %}
    <div class="research-card__visual research-card__visual--{{ research.visual }}" aria-hidden="true">
      <span class="research-card__line"></span>
      <span class="research-card__line research-card__line--two"></span>
    </div>
  {% endif %}
  <div class="research-card__content">
    <span class="eyebrow">{{ research.category }}</span>
    <h3>{{ research.title }}</h3>
    <p class="research-card__org">{{ research.organization }}</p>
    <p>{{ research.summary }}</p>
    <span class="card-link">Read research summary <span aria-hidden="true">→</span></span>
  </div>
</a>
