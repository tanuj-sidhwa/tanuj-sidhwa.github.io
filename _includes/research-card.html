
{% assign research = include.item %}

<a class="research-entry" href="{{ research.url | relative_url }}">
  <div class="research-entry__body">

    <h3>{{ research.title }}</h3>

    <p class="entry-affiliation">
      {{ research.organization }}
    </p>

    <p class="entry-summary">
      {{ research.summary }}
    </p>

  </div>
</article>
